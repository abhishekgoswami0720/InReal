<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" fill="none" role="img" aria-labelledby="t"><title id="t">Three checks: rules, comparison with 49 known scam patterns, and an AI judge that must quote evidence</title><style>.s{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{animation:up .6s ease-out both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="fr"><rect width="1000" height="330" rx="20"/></clipPath></defs><rect x=".5" y=".5" width="999" height="329" rx="20" fill="#fffbf5" stroke="#ece3d7"/><text class="s" x="40" y="48" font-size="20" font-weight="800" fill="#0f172a">Every post goes through three checks</text><text class="s" x="40" y="72" font-size="14" fill="#5b6474">A post is hidden only when there is proof in the post itself.</text><g class="up" style="animation-delay:0.20s"><rect x="40" y="96" width="288" height="132" rx="16" fill="#ffffff" stroke="#ece3d7"/><rect x="40" y="96" width="288" height="5" rx="2.5" fill="#f97316"/><circle cx="74" cy="136" r="16" fill="#f97316" fill-opacity=".15"/><text class="s" x="74" y="142" font-size="16" font-weight="800" fill="#f97316" text-anchor="middle">1</text><text class="s" x="100" y="142" font-size="17" font-weight="750" fill="#0f172a">Rule check</text><text class="s" x="60" y="180" font-size="13.5" fill="#5b6474">Looks for words scams use:</text><text class="s" x="60" y="202" font-size="13.5" font-weight="650" fill="#0f172a">“registration fee”, “pay to start”</text></g><path class="up" style="animation-delay:0.40s" d="M332,162 h20 m-6,-6 l6,6 -6,6" stroke="#98a1ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="up" style="animation-delay:0.55s"><rect x="356" y="96" width="288" height="132" rx="16" fill="#ffffff" stroke="#ece3d7"/><rect x="356" y="96" width="288" height="5" rx="2.5" fill="#d97706"/><circle cx="390" cy="136" r="16" fill="#d97706" fill-opacity=".15"/><text class="s" x="390" y="142" font-size="16" font-weight="800" fill="#d97706" text-anchor="middle">2</text><text class="s" x="416" y="142" font-size="17" font-weight="750" fill="#0f172a">Compare with real scams</text><text class="s" x="376" y="180" font-size="13.5" fill="#5b6474">Matches the post against</text><text class="s" x="376" y="202" font-size="13.5" font-weight="650" fill="#0f172a">49 scam patterns and 15 genuine ones</text></g><path class="up" style="animation-delay:0.75s" d="M648,162 h20 m-6,-6 l6,6 -6,6" stroke="#98a1ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="up" style="animation-delay:0.90s"><rect x="672" y="96" width="288" height="132" rx="16" fill="#ffffff" stroke="#ece3d7"/><rect x="672" y="96" width="288" height="5" rx="2.5" fill="#e11d48"/><circle cx="706" cy="136" r="16" fill="#e11d48" fill-opacity=".15"/><text class="s" x="706" y="142" font-size="16" font-weight="800" fill="#e11d48" text-anchor="middle">3</text><text class="s" x="732" y="142" font-size="17" font-weight="750" fill="#0f172a">AI judge</text><text class="s" x="692" y="180" font-size="13.5" fill="#5b6474">Reads the whole post and must</text><text class="s" x="692" y="202" font-size="13.5" font-weight="650" fill="#0f172a">quote the exact line that proves a scam</text></g><g class="up" style="animation-delay:1.30s"><rect x="42.0" y="262" width="364.0" height="10" rx="5" fill="#059669"/><text class="s" x="44.0" y="294" font-size="13.5" font-weight="700" fill="#059669">Shown</text><text class="s" x="44.0" y="312" font-size="12" fill="#98a1ae">less than 40% sure it's a scam</text></g><g class="up" style="animation-delay:1.42s"><rect x="410.0" y="262" width="272.0" height="10" rx="5" fill="#d97706"/><text class="s" x="412.0" y="294" font-size="13.5" font-weight="700" fill="#d97706">Shown, marked for review</text><text class="s" x="412.0" y="312" font-size="12" fill="#98a1ae">40–70%</text></g><g class="up" style="animation-delay:1.54s"><rect x="686.0" y="262" width="272.0" height="10" rx="5" fill="#e11d48"/><text class="s" x="688.0" y="294" font-size="13.5" font-weight="700" fill="#e11d48">Hidden</text><text class="s" x="688.0" y="312" font-size="12" fill="#98a1ae">70% or more, with the line quoted</text></g></svg>