eight="18" rx="6" fill="#f6f1ea"/><rect class="bar" x="360" y="140" width="280.0" height="18" rx="6" fill="#d97706" style="animation-delay:0.23s"/><text class="m" x="650.0" y="154" font-size="13" font-weight="700" fill="#d97706">7</text><text class="s" x="40" y="191" font-size="14.5" fill="#0f172a">Pays for online “tasks”</text><rect x="360" y="178" width="480" height="18" rx="6" fill="#f6f1ea"/><rect class="bar" x="360" y="178" width="280.0" height="18" rx="6" fill="#e11d48" style="animation-delay:0.31s"/><text class="m" x="650.0" y="192" font-size="13" font-weight="700" fill="#e11d48">7</text><text class="s" x="40" y="229" font-size="14.5" fill="#0f172a">Wants ID, bank details or OTP early</text><rect x="360" y="216" width="480" height="18" rx="6" fill="#f6f1ea"/><rect class="bar" x="360" y="216" width="200.0" height="18" rx="6" fill="#e11d48" style="animation-delay:0.39s"/><text class="m" x="570.0" y="230" font-size="13" font-weight="700" fill="#e11d48">5</text><text class="s" x="40" y="267" font-size="14.5" fill="#0f172a">Moves you to WhatsApp or Telegram</text><rect x="360" y="254" width="480" height="18" rx="6" fill="#f6f1ea"/><rect class="bar" x="360" y="254" width="200.0" height="18" rx="6" fill="#d97706" style="animation-delay:0.47s"/><text class="m" x="570.0" y="268" font-size="13" font-weight="700" fill="#d97706">5</text><text class="s" x="40" y="305" font-size="14.5" fill="#0f172a">Promises that sound too good</text><rect x="360" y="292" width="480" height="18" rx="6" fill="#f6f1ea"/><rect class="bar" x="360" y="292" width="200.0" height="18" rx="6" fill="#d97706" style="animation-delay:0.55s"/><text class="m" x="570.0" y="306" font-size="13" font-weight="700" fill="#d97706">5</text><text class="s" x="40" y="343" font-size="14.5" fill="#0f172a">Rushes you to decide</text><rect x="360" y="330" width="480" height="18" rx="6" fill="#f6f1ea"/><rect class="bar" x="360" y="330" width="160.0" height="18" rx="6" fill="#059669" style="animation-delay:0.63s"/><tex