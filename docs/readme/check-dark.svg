<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" fill="none" role="img" aria-labelledby="t"><title id="t">Three checks: rules, comparison with 49 known scam patterns, and an AI judge that must quote evidence</title><style>.s{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{animation:up .6s ease-out both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="fr"><rect width="1000" height="330" rx="20"/></clipPath></defs><rect x=".5" y=".5" width="999" height="329" rx="20" fill="#11151d" stroke="#2a3242"/><text class="s" x="40" y="48" font-size="20" font-weight="800" fill="#eef1f6">Every post goes through three checks</text><text class="s" x="40" y="72" font-size="14" fill="#a3adbd">A post is hidden only when there is proof in the post itself.</text><g class="up" style="animation-delay:0.20s"><rect x="40" y="96" width="288" height="132" rx="16" fill="#171c26" stroke="#2a3242"/><rect x="40" y="96" width="288" height="5" rx="2.5" fill="#fb923c"/><circle cx="74" cy="136" r="16" fill="#fb923c" fill-opacity=".15"/><text class="s" x="74" y="142" font-size="16" font-weight="800" fill="#fb923c" text-anchor="middle">1</text><text class="s" x="100" y="142" font-size="17" font-weight="750" fill="#eef1f6">Rule check</text><text class="s" x="60" y="180" font-size="13.5" fill="#a3adbd">Looks for words scams use:</text><text class="s" x="60" y="202" font-size="13.5" font-weight="650" fill="#eef1f6">“registration fee”, “pay to start”</text></g><path class="up" style="animation-delay:0.40s" d="M332,162 h20 m-6,-6 l6,6 -6,6" stroke="#6b7587" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="up" style="animation-delay:0.55s"><rect x="356" y="96" width="288" height="132" rx="16" fill="#171c26" stroke="#2a3242"/><rect x="356" y="96" width="288" height="5" rx="2.5" fill="#fbbf24"/><circle cx="390" cy="136" r="16" fill="#fbbf24" fill-opacity=".15"/><text class="s" x="390" y="142" font-size="16" font-weight="800" fill="#fbbf24" text-anchor="middle">2</text><text class="s" x="416" y="142" font-size="17" font-weight="750" fill="#eef1f6">Compare with real scams</text><text class="s" x="376" y="180" font-size="13.5" fill="#a3adbd">Matches the post against</text><text class="s" x="376" y="202" font-size="13.5" font-weight="650" fill="#eef1f6">49 scam patterns and 15 genuine ones</text></g><path class="up" style="animation-delay:0.75s" d="M648,162 h20 m-6,-6 l6,6 -6,6" stroke="#6b7587" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="up" style="animation-delay:0.90s"><rect x="672" y="96" width="288" height="132" rx="16" fill="#171c26" stroke="#2a3242"/><rect x="672" y="96" width="288" height="5" rx="2.5" fill="#fb7185"/><circle cx="706" cy="136" r="16" fill="#fb7185" fill-opacity=".15"/><text class="s" x="706" y="142" font-size="16" font-weight="800" fill="#fb7185" text-anchor="middle">3</text><text class="s" x="732" y="142" font-size="17" font-weight="750" fill="#eef1f6">AI judge</text><text class="s" x="692" y="180" font-size="13.5" fill="#a3adbd">Reads the whole post and must</text><text class="s" x="692" y="202" font-size="13.5" font-weight="650" fill="#eef1f6">quote the exact line that proves a scam</text></g><g class="up" style="animation-delay:1.30s"><rect x="42.0" y="262" width="364.0" height="10" rx="5" fill="#34d399"/><text class="s" x="44.0" y="294" font-size="13.5" font-weight="700" fill="#34d399">Shown</text><text class="s" x="44.0" y="312" font-size="12" fill="#6b7587">less than 40% sure it's a scam</text></g><g class="up" style="animation-delay:1.42s"><rect x="410.0" y="262" width="272.0" height="10" rx="5" fill="#fbbf24"/><text class="s" x="412.0" y="294" font-size="13.5" font-weight="700" fill="#fbbf24">Shown, marked for review</text><text class="s" x="412.0" y="312" font-size="12" fill="#6b7587">40–70%</text></g><g class="up" style="animation-delay:1.54s"><rect x="686.0" y="262" width="272.0" height="10" rx="5" fill="#fb7185"/><text class="s" x="688.0" y="294" font-size="13.5" font-weight="700" fill="#fb7185">Hidden</text><text class="s" x="688.0" y="312" font-size="12" fill="#6b7587">70% or more, with the line quoted</text></g></svg>