<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="444" viewBox="0 0 1000 444" fill="none" role="img" aria-labelledby="t"><title id="t">8 scam groups with 49 patterns: paying 12, paid courses 7, tasks 7, ID/OTP 5, off-platform 5, too good 5, pressure 4, MLM 4</title><style>.s{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}.bar{transform-box:fill-box;transform-origin:left;animation:bar .8s cubic-bezier(.2,.7,.2,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="fr"><rect width="1000" height="444" rx="20"/></clipPath></defs><rect x=".5" y=".5" width="999" height="443" rx="20" fill="#11151d" stroke="#2a3242"/><text class="s" x="40" y="48" font-size="20" font-weight="800" fill="#eef1f6">The 8 kinds of scam InReal knows</text><text class="s" x="40" y="72" font-size="14" fill="#a3adbd">number of real scam patterns in each group</text><circle cx="700" cy="67" r="5" fill="#fb7185"/><text class="s" x="710" y="71.5" font-size="12.5" fill="#a3adbd">serious</text><circle cx="796" cy="67" r="5" fill="#fbbf24"/><text class="s" x="806" y="71.5" font-size="12.5" fill="#a3adbd">medium</text><circle cx="892" cy="67" r="5" fill="#34d399"/><text class="s" x="902" y="71.5" font-size="12.5" fill="#a3adbd">mild</text><text class="s" x="40" y="115" font-size="14.5" fill="#eef1f6">Asks you to pay</text><rect x="360" y="102" width="480" height="18" rx="6" fill="#1d2330"/><rect class="bar" x="360" y="102" width="480.0" height="18" rx="6" fill="#fb7185" style="animation-delay:0.15s"/><text class="m" x="850.0" y="116" font-size="13" font-weight="700" fill="#fb7185">12</text><text class="s" x="40" y="153" font-size="14.5" fill="#eef1f6">Paid course sold as an internship</text><rect x="360" y="140" width="480" height="18" rx="6" fill="#1d2330"/><rect class="bar" x="360" y="140" width="280.0" height="18" rx="6" fill="#fbbf24" style="animation-delay:0.23s"/><text class="m" x="650.0" y="154" font-size="13" font-weight="700" fill="#fbbf24">7</text><text class="s" x="40" y="191" font-size="14.5" fill="#eef1f6">Pays for online “tasks”</text><rect x="360" y="178" width="480" height="18" rx="6" fill="#1d2330"/><rect class="bar" x="360" y="178" width="280.0" height="18" rx="6" fill="#fb7185" style="animation-delay:0.31s"/><text class="m" x="650.0" y="192" font-size="13" font-weight="700" fill="#fb7185">7</text><text class="s" x="40" y="229" font-size="14.5" fill="#eef1f6">Wants ID, bank details or OTP early</text><rect x="360" y="216" width="480" height="18" rx="6" fill="#1d2330"/><rect class="bar" x="360" y="216" width="200.0" height="18" rx="6" fill="#fb7185" style="animation-delay:0.39s"/><text class="m" x="570.0" y="230" font-size="13" font-weight="700" fill="#fb7185">5</text><text class="s" x="40" y="267" font-size="14.5" fill="#eef1f6">Moves you to WhatsApp or Telegram</text><rect x="360" y="254" width="480" height="18" rx="6" fill="#1d2330"/><rect class="bar" x="360" y="254" width="200.0" height="18" rx="6" fill="#fbbf24" style="animation-delay:0.47s"/><text class="m" x="570.0" y="268" font-size="13" font-weight="700" fill="#fbbf24">5</text><text class="s" x="40" y="305" font-size="14.5" fill="#eef1f6">Promises that sound too good</text><rect x="360" y="292" width="480" height="18" rx="6" fill="#1d2330"/><rect class="bar" x="360" y="292" width="200.0" height="18" rx="6" fill="#fbbf24" style="animation-delay:0.55s"/><text class="m" x="570.0" y="306" font-size="13" font-weight="700" fill="#fbbf24">5</text><text class="s" x="40" y="343" font-size="14.5" fill="#eef1f6">Rushes you to decide</text><rect x="360" y="330" width="480" height="18" rx="6" fill="#1d2330"/><rect class="bar" x="360" y="330" width="160.0" height="18" rx="6" fill="#34d399" style="animation-delay:0.63s"/><tex